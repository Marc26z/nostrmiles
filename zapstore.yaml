# Zapstore publishing config.
#
# Committing this file to the repository is what lets Zapstore auto-whitelist
# the publisher: when the app event reaches the relay, Zapstore fetches this
# file, checks that `pubkey` matches the signing key, and whitelists it.
#
# The first publish is done with the wizard, which can fill this in for you:
#   zsp publish --wizard
#
# `repository` points at where the signed APK release lives.
